# Local stack: `docker compose up --build`
#   API      http://localhost:8000  (/health, /health/ready, /docs)
#   Qdrant   http://localhost:6333  (dashboard at /dashboard)
#   Phoenix  http://localhost:6006  (trace UI; OTLP HTTP on :6006, gRPC on :4317)
# The MCP server joins this file in Phase 2.

name: agentic-docs-assistant

services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      phoenix:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image ships without curl; use bash's /dev/tcp to probe the HTTP endpoint.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-22.0.1
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data
    restart: unless-stopped

volumes:
  qdrant_data:
  phoenix_data:
