[project]
name = "agentic-docs-assistant"
version = "0.1.0"
description = "Agentic assistant that answers questions about a repository's docs (RAG with citations) and takes approved actions through MCP."
readme = "README.md"
license = "MIT"
# Upper bound: arize-phoenix-otel supports <3.16, openinference-instrumentation-langchain <3.15.
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "httpx>=0.28.1",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[project.scripts]
docs-assistant-api = "docs_assistant.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_assistant"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "evals"]
# Prose folders: ruff also formats code blocks in Markdown; specs use illustrative, aligned snippets.
extend-exclude = ["specs", "prompts", "docs"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "ASYNC",         # async pitfalls (blocking calls in async code)
    "S",             # bandit (security)
    "RUF",
    "PL",            # pylint subset
    "ANN",           # type annotations
]
ignore = ["PLR2004"]  # magic values in comparisons: too noisy for tests/config

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004"]
"evals/**" = ["S101"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["docs_assistant"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs running services (Qdrant, MCP server); skipped in unit runs",
]
